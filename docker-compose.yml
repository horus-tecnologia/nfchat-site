# Deploy independente do SITE (mesmo servidor Linux dos demais projetos nfchat).
# Cada projeto tem seu próprio compose -> atualização independente.
# A atualização é feita PELA PIPELINE (job deploy): `docker compose pull` + `up -d`.
# Sem Watchtower.
#
# No servidor (uma vez): docker login ghcr.io  &&  docker compose -p nfchat-site up -d
# Depois: a cada push na main, a Action publica a imagem e roda o deploy aqui.

services:
  nfchat-site:
    image: ghcr.io/horus-tecnologia/nfchat-site:latest
    container_name: nfchat-site
    restart: unless-stopped
    ports:
      - "8083:80"           # site -> http://<host>:8083 (proxy reverso cuida do domínio)
